name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_stability:
        description: Run the privileged Docker/Swarm fault tier
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.13.5

      - name: Run Go tests
        run: go test ./...

      - name: Run fast stability matrix
        run: go run ./cmd/autback-stability --mode fast --artifacts .tmp/stability/fast

      - name: Run full stability matrix
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_stability }}
        run: go run ./cmd/autback-stability --mode full --artifacts .tmp/stability/full

      - name: Validate protobuf contract
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 lint
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 breaking --against api/compat/control-v1.binpb
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 generate
          git diff --exit-code -- internal/gen

      - name: Validate Terraform
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
