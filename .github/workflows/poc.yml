name: Outback POC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: outback-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.repository == 'flidai/outback'
    environment: outback-poc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Outback
        uses: ./action/setup-outback
        with:
          version: 0.1.0
          allow-source-fallback: true
          service-url: ${{ vars.OUTBACK_SERVICE_URL }}
          project: poc
          image: ${{ vars.OUTBACK_PROJECT_IMAGE }}
          ca-certificate: ${{ vars.OUTBACK_CA_CERTIFICATE }}

      - name: Check worker dependencies
        run: outback doctor

      - name: Run Testcontainers remotely
        working-directory: examples/go-redis
        run: outback exec -- go test -count=1 -v ./...
