#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - docker.io
  - openssl
  - zstd

users:
  - default
  - name: autback
    system: true
    shell: /usr/sbin/nologin
    groups: docker

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"log-driver":"local","log-opts":{"max-size":"20m","max-file":"3"},"cgroup-parent":"autback-workloads.slice"}

runcmd:
  - [mkdir, -p, /etc/autback, /var/lib/autback/jobs]
  - [chown, -R, "autback:autback", /var/lib/autback]
  - [systemctl, restart, docker]
